name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      DEBUG: "true"
      JWT_SECRET: "ci-only-secret-not-for-production"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all backend tests
        run: python -m pytest tests -v --tb=short

      - name: Block high-severity security findings
        run: python -m bandit -r app --severity-level high -f json

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend verification
        run: npm run verify

  postgres-lore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: novel_agent_test
          POSTGRES_USER: novel_test
          POSTGRES_PASSWORD: novel_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novel_test -d novel_agent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DEBUG: "true"
      JWT_SECRET: "ci-only-secret-not-for-production"
      DATABASE_URL: "postgresql+asyncpg://novel_test:novel_test_password@localhost:5432/novel_agent_test"
      TEST_DATABASE_URL: "postgresql+asyncpg://novel_test:novel_test_password@localhost:5432/novel_agent_test"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exercise PostgreSQL migration rollback
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade 8b87ca11f912
          python -m alembic upgrade head

      - name: Run lore and read-only preflight tests on PostgreSQL
        run: >-
          python -m pytest
          tests/test_lore_api.py
          tests/test_lore_models.py
          tests/test_lore_writes.py
          tests/test_lore_extraction.py
          tests/test_lore_reviews.py
          tests/test_lore_merge_preview.py
          tests/test_lore_merge_commit.py
          tests/test_lore_migration_preview.py
          tests/test_json_preflight_postgres.py
          tests/test_legacy_json_maintenance.py
          -v --tb=short

  docker-build:
    needs: [backend-test, frontend-test, postgres-lore]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t novel-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t novel-frontend:ci ./frontend
