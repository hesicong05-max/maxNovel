version: "3.9"

services:
  backend:
    build: ./backend
    container_name: novel-backend
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
    environment:
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:8080
      # Auth / JWT — change in production!
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production-please-use-a-long-random-string}
      # Sentry — leave empty to disable
      - SENTRY_DSN=${SENTRY_DSN:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_SENTRY_DSN=${VITE_SENTRY_DSN:-}
    container_name: novel-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
