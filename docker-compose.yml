services:
  # ── PostgreSQL (production database) ──
  db:
    image: m.daocloud.io/docker.io/library/postgres:16.4-alpine3.20
    container_name: novel-db
    environment:
      POSTGRES_DB: novel_agent
      POSTGRES_USER: "${DB_USER:?ERROR: DB_USER must be set}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?ERROR: DB_PASSWORD must be set}"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d novel_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    init: true

  backend:
    build:
      context: ./backend
      args:
        - GIT_COMMIT=${GIT_COMMIT:-unknown}
    container_name: novel-backend
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
    env_file:
      - backend/.env.prod
    environment:
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/novel_agent
      - "JWT_SECRET=${JWT_SECRET:?ERROR: JWT_SECRET must be set}"
      - SENTRY_DSN=${SENTRY_DSN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    init: true
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_SENTRY_DSN=${VITE_SENTRY_DSN:-}
    container_name: novel-frontend
    ports:
      - "8080:80"
      # TLS disabled by default; configure via 1Panel reverse proxy instead
    volumes:
      # Mount TLS certificates for HTTPS
      # Place your fullchain.pem and privkey.pem in ./tls/
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    init: true

volumes:
  backend-data:
  db-data:
