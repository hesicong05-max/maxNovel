version: "3.9"

services:
  backend:
    build: ./backend
    container_name: novel-backend
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
    environment:
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:8080
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: novel-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
