# --- HTTP server (for IP access or 1Panel reverse proxy) ---
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Upload size limit — match backend MAX_UPLOAD_SIZE (10MB)
    client_max_body_size 10m;

    # Hide nginx version
    server_tokens off;

    # Honor client IP headers only from private/local reverse proxies (for
    # example 1Panel or Docker), then pass a single sanitized address onward.
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP: allow Sentry connect-src if DSN is configured
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.ingest.sentry.io; frame-ancestors 'none'" always;

    # SPA routing — fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
        # Prevent browser from caching index.html — ensures latest JS bundle references
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support — disable buffering, extend timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
